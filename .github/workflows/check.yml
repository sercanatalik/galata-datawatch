# The same check the tree runs locally, on every push.
#
# **One command, not a list of steps.** `scripts/check-all.sh` already means
# "everything": format, clippy, fourteen guards, the harness that proves each
# guard can fail, and the tests. A workflow that enumerated those separately
# would be a second definition of "everything" — and the one that drifts is
# the one nobody runs locally.
name: check

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **The toolchain is not named here.** `rust-toolchain.toml` pins
      # 1.98.1 and rustup honours it, so naming a version in this file would
      # be a second statement of the same fact — and two statements of one
      # fact do not fail when they disagree, they disagree.
      #
      # This step exists to make rustup resolve and install it *before* the
      # cache key is computed, because that key includes the rustc version.
      - name: Resolve the pinned toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      # **The one network step.** Everything below runs `--offline`, which is
      # deliberate: the workspace is provable offline, and an accidental
      # network dependency should fail rather than succeed quietly. `--locked`
      # means a stale `Cargo.lock` fails here rather than being updated under
      # us.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # The scheduling lane's half of the same network step: `uv sync` fetches
      # what `py/uv.lock` names, so `check-all.sh` can run the lane with
      # `--offline`, as it runs cargo. `--locked` for the same reason as above.
      #
      # **Pinned to a commit, not a floating major.** setup-uv publishes exact
      # version tags only (v10.2.0, v10.1.0, …) — there is no `v10` — and
      # `@v10` failed the first run that used it: "unable to find version
      # v10". Its own README pins by SHA, as GitHub advises for a third-party
      # action; the comment carries the version a reader wants.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Fetch the scheduling lane's dependencies
        run: uv sync --locked --project py

      - name: check-all
        run: ./scripts/check-all.sh

  # **Reverse-dependency CI: does the consumer still compile?**
  #
  # galata-tower takes four crates from here BY PATH — galata-segments,
  # galata-wire, galata-broker and galata-datawatch — and builds against
  # whatever this repository's default branch holds. Without this job, a
  # removed field or a renamed method turns the tower red and leaves this
  # workspace green: the signal arrives in the wrong repository, to whoever
  # pushes there next, about a change somebody made here.
  #
  # That is not hypothetical. On 2026-09-22, within minutes of the tower
  # getting CI at all:
  #
  #   error[E0599]: no method named `connected` found for `&mut NatsSubscriber`
  #   error[E0560]: struct `Window` has no field named `ticker`
  #
  # Both were additions made here and not yet pushed. **With path
  # dependencies the upstream is pushed first** — that is the ordering, and
  # it is written here because that is where it bit.
  #
  # **A TYPE-CHECK, NOT THE TOWER'S GATE.** This finds the class above and
  # nothing else: it does not run the tower's tests, its screen tests or its
  # seven guards. Those belong to the tower, and a copy of its gate here
  # would be a second definition of "the tower is fine" — which is the
  # failure this workspace spends its own guards preventing.
  #
  # It retires itself. When these crates publish and the tower takes them
  # from the registry with a version, this stops being the mechanism — the
  # same sentence `test-guards.sh` carries about its symlink.
  #
  # Separate and parallel, so the wall clock does not move and the report
  # names which half failed: "your workspace is fine and the tower no longer
  # compiles" is a different sentence from "your workspace is broken".
  downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: galata-datawatch

      # Its default branch, symmetrically with what the tower does to this
      # repository. Pinning would test a pair no working tree has.
      - uses: actions/checkout@v4
        with:
          repository: sercanatalik/galata-tower
          path: galata-tower

      - name: Resolve the pinned toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: galata-tower

      # The tower's own lockfile. `--locked` so a stale one fails rather than
      # being updated under us.
      - name: Fetch the tower's dependencies
        working-directory: galata-tower
        run: cargo fetch --locked

      - name: Does the tower still compile against this?
        working-directory: galata-tower
        run: cargo check --all-targets --locked
