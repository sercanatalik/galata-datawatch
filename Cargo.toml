[workspace]
resolver = "3"
members = [
    "crates/galata-wire",
    "crates/galata-broker",
    "crates/galata-segments",
    "crates/galata-datawatch",
    # Not published. The vault lives here so the four above can say they link
    # none of it, and a guard can check that rather than a comment claiming it.
    "crates/galata-datawatch-vault",
]

# Declared once, and taken once — every member says `license.workspace = true`.
#
# `scripts/check-release-hygiene.sh` fails the build if a member states a
# licence of its own. No registry reads these fields; licence scanners,
# `cargo deny` and anyone vendoring the tree read exactly them, and a second
# place to state a licence is a place for two to disagree.
[workspace.package]
# Not inherited by any member, which cargo warns about — and a field no
# crate carries is a field that says nothing. Named here so the workspace
# still records who owns it.
# authors = ["Sercan Atalik <6832079+sercanatalik@users.noreply.github.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sercanatalik/galata-datawatch"
# Matches rust-toolchain.toml. Two places state a version because they answer
# different questions: the toolchain file selects the compiler, this states the
# floor a consumer needs.
rust-version = "1.98"
version = "0.1.0"

# Declared once, and USED once — every member says `workspace = true`.
#
# `scripts/check-workspace-deps.sh` fails the build if a member re-declares a
# version for anything named here, and also if this table names something no
# member uses. A table nobody references reads as though versions are pinned in
# one place when they are not, and the pin that loses is the one nobody reads.
[workspace.dependencies]
# The columnar format. CONFINED to galata-segments and, later, the tape:
# galata-wire must never link it, because every future consumer of the
# vocabulary links galata-wire and a process that only names an event must not
# inherit a columnar format to do it. Held by check-workspace-deps.sh.
arrow = "60"
parquet = { version = "60", features = ["arrow"] }
# Exact numbers. 96-bit, about 28 significant digits — below the
# decimal(38,18) written to disk, which holds 38. See `Num` for why that bound
# is acceptable and why it is stated rather than discovered.
# `serde-str` is not a default and is load-bearing. rust_decimal's ordinary
# serde emits a float-looking value and deserialises it THROUGH f64 — precision
# loss, in the type chosen precisely because f64 loses precision. Every Decimal
# round-trips as a string instead, globally, because the per-field alternative
# is thirty annotations and the failure of forgetting one is silent.
rust_decimal = { version = "1", features = ["serde-str"] }
# The bus. 0.50 is the current line; `publish` buffers internally and returns
# without waiting for the wire, which is what lets a bounded channel in front of
# it be the only place backpressure is decided.
async-nats = "0.50"
# Request signing for a venue that authenticates every call. Not a default
# feature: a signature is a pure function, and a tape reader has no use for one.
ed25519-dalek = "3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
# `raw_value` is load-bearing, not a convenience: a normaliser peeks at a
# frame's channel and takes its `data` as a borrowed span, then types that span
# alone. Without it every frame is parsed into a Value tree first.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
# The runtime, and the transport. `tokio-tungstenite` rather than
# `fastwebsockets`, in order of weight: this workspace forbids `unsafe` and
# that crate is reported unsound; the published benchmarks disagree on which is
# faster; and the frame decoder is not the bottleneck here — parquet writing
# and JSON parsing are.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# **Declared explicitly, and this is not optional.** rustls 0.23 is
# provider-agnostic: `tokio-tungstenite`'s rustls feature selects the TLS
# stack but NOT the cryptography behind it, and a build that names neither
# `ring` nor `aws-lc-rs` compiles cleanly and then panics on the first
# connection — "could not automatically determine the process-level
# CryptoProvider". A runtime panic rather than a compile error, which is
# exactly the kind of failure that is found in production rather than in CI.
#
# `ring` over `aws-lc-rs`: the latter is faster and wants a C toolchain and
# cmake at build time, which a published crate should not require of its
# consumers. TLS handshakes happen once per connection here, roughly every
# eight minutes.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# **`default-features = false` against reqwest's own default, on purpose.**
# 0.13 switched its default TLS to rustls with **aws-lc** as the provider. Two
# providers in one binary is the failure above in a second costume: rustls
# refuses to choose, and the binary compiles and then panics on its first
# request. `ring` here keeps one provider in the process, and avoids the cmake
# and NASM that aws-lc wants at build time.
#
# `json` for the venue's request bodies; `query` and `form` are features in
# 0.13 and neither is used.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
tokio-util = "0.7"
futures-util = "0.3"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Jitter on reconnect backoff. Not for a thundering herd — three processes on
# one host is not one — but for the venue's per-IP new-connection budget, which
# a tight reconnect loop can spend while learning nothing.
rand = "0.10"
# The vault, and it reaches exactly one member. End-to-end-encrypted config
# documents; the SDK is synchronous throughout, so a ConfigSource backed by it
# needs no runtime and bridges nothing. Confined to galata-datawatch-vault by
# `check-vault-reach.sh`, because it brings `age` and its localisation stack
# with it — 104 crates on top of this tree, measured.
galata-vault = "0.1"

[workspace.lints.rust]
# Neither crate needs it, and a store whose durability argument rests on
# `rename` has no business also asking to be trusted with raw pointers.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
