# The declared signals. Each horizon's model is a person's choice, citing the
# evidence behind it (galata-research's volatility study, roadmap Tier 16).
# EWMA is declared, never fallen back to: a fitted horizon whose sample is
# too short is a refusal, written as absent rows.
#
# `model` is a gr.models.vol step-1 model; `corr` is "dcc", "cdcc", "ccc" or
# "ewma" (RiskMetrics, nothing fitted, `lam`). `deseasonalise` divides returns
# by an hour-of-day factor fitted through the last close.
#
# CORRELATION: CONSTANT (CCC, Bollerslev 1990), CHOSEN BY THE OPERATOR ON
# 2026-09-28 for 5m, 1h and 4h. R is the refit window's correlation of the
# margins' standardised returns (Q-bar normalised), a = b = 0.
#   - For DCC: the registered study (galata-research,
#     planning/preregistered/correlation-models.md) found DCC beats CCC on R
#     alone for BTC/ETH/HYPE at 4h (Holm p 1e-6, 1,985 origins).
#   - For CCC: on the six instruments declared here, measured descriptively on
#     a copy of the record, one-step multivariate QLIKE, DCC minus CCC:
#     4h +0.155 (p 0.34, 787 origins), 1h +0.020 (p 0.74, 2,531),
#     5m -0.030 (p 0.30, 642). No horizon distinguishes them.
#   - The cost: R cannot rise in a crisis until the next run refits, which
#     matters most for highly correlated pairs (Engle and Colacito 2006).
#     `surprise` and `turbulence` still register such an episode.

[varcov.5m]
# From 1m bars (captured since 2026-09-20). GARCH-t: the study's baseline;
# nothing supports GJR below 4h. Deseasonalised: the daily cycle.
bars = "1m"
model = "garch"
dist = "t"
corr = "ccc"
deseasonalise = true

[varcov.30m]
# From 1m bars: ~336 joint returns on 2026-09-28, under min_obs. Declared
# EWMA until the sample passes 500.
bars = "1m"
corr = "ewma"
lam = 0.94

[varcov.1h]
# GARCH-t deseasonalised: the study's 1h finding (α+β≈1 is the daily cycle).
bars = "1h"
model = "garch"
dist = "t"
corr = "ccc"
deseasonalise = true

[varcov.4h]
# GJR-t: the leverage effect was found at BTC 4h.
bars = "4h"
model = "gjr"
dist = "t"
corr = "ccc"

[varcov.1d]
# CL's 265 days are under min_obs until about May 2027.
bars = "1d"
corr = "ewma"
lam = 0.94

[varcov.1w]
# From 1d bars; 37 weeks.
bars = "1d"
corr = "ewma"
lam = 0.94

[carry]
# Each dex's interest-only baseline, hourly: the rate at a neutral premium.
# Main dex: 0.01% per 8h, settled hourly at 1/8 (Hyperliquid docs, Funding).
# xyz: the deployer's funding multiplier of 0.5 on the same interest rate,
# inferred from the record on 2026-09-28 (CL, GOLD and XYZ100 fit
# 0.5 × (P + clamp(0.0001 − P, ±0.0003)) / 8 exactly). The deployer can change
# it (setFundingMultipliers); re-derive, and date the change here.
baseline = { main = 0.0000125, xyz = 0.00000625 }
dex = { xyz = ["CL", "GOLD", "XYZ100"] }
