[package]
name = "galata-datawatch"
description = "Market data capture: the record every payload lands in verbatim, and the one path it crosses to get there."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["market-data", "capture", "parquet", "archive", "trading"]
categories = ["database-implementations", "finance"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lints]
workspace = true

# The runtime and the transport arrive here, and nothing else does: no HTTP
# client, no broker client, no credential reader. Everything below the capture
# loop is still provable with no network — the loop itself is driven against a
# fake source and a controllable clock — and only the soak needs a venue.
[dependencies]
arrow.workspace = true
galata-segments = { version = "0.1.0", path = "../galata-segments" }
galata-wire = { version = "0.1.0", path = "../galata-wire" }
# The adapter parses frames. Still no runtime, no HTTP client, no broker.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

[features]
default = ["hyperliquid"]
# The seam itself is unconditional; an adapter is a feature.
hyperliquid = []

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
