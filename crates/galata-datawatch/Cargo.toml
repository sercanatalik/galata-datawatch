[package]
name = "galata-datawatch"
description = "Market data capture: the record every payload lands in verbatim, and the one path it crosses to get there."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["market-data", "capture", "parquet", "archive", "trading"]
categories = ["database-implementations", "finance"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

# **How docs.rs builds this.**
#
# `all-features` rather than a list: a list would sit beside `[features]` and
# silently omit one added later, which is the exact failure this prevents one
# level up. Safe because the feature set is ADDITIVE — no feature turns
# another off — which `check-workspace-deps.sh` is what keeps true.
#
# `--cfg docsrs` turns on `doc_auto_cfg` in the crate root, so every gated item
# carries a badge naming the feature it needs. Hand-written `#[doc(cfg(...))]`
# would be a second statement of what `#[cfg(...)]` already says, one line away
# from disagreeing with it.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# The runtime and the transport arrive here, and nothing else does: no HTTP
# client, no broker client, no credential reader. Everything below the capture
# loop is still provable with no network — the loop itself is driven against a
# fake source and a controllable clock — and only the soak needs a venue.
[dependencies]
arrow.workspace = true
galata-segments = { version = "0.1.0", path = "../galata-segments" }
galata-wire = { version = "0.1.0", path = "../galata-wire" }
galata-broker = { version = "0.1.0", path = "../galata-broker", optional = true }
# The adapter parses frames. Still no runtime, no HTTP client, no broker.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = { workspace = true }
tracing = { workspace = true }
# THE TRANSPORT, and every one of these is optional.
#
# A consumer that reads the tape links this crate, and before the `capture`
# feature existed it compiled 541 crates to do it — a runtime, a websocket
# stack, an HTTP client and a TLS provider, to read parquet. That is the same
# wall `galata-wire` and `galata-broker` already have, one level in.
#
# `scripts/check-workspace-deps.sh` fails the build if any of these reaches a
# tree built with `--no-default-features`.
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = ["capture", "hyperliquid", "rh-crypto", "ledger", "bin"]
# **The transport.** Everything that needs a runtime: the loop, the clock, the
# websocket source and every adapter's HTTP client.
#
# The record, the tape, replay, the calendar, configuration, the venue seam and
# every adapter's `wire` and `normalise` are OUTSIDE it — all of them pure
# functions of bytes or a file on disk. That the seam is outside is not an
# accident; its own documentation has said so since Tier 1: *a fact that needs a
# runtime to state is a fact that cannot be asserted in a test.*
capture = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tokio-util",
    "dep:futures-util",
    "dep:rand",
    "dep:rustls",
    "dep:reqwest",
    # Verifying a rescue's pages against their recorded hashes before an
    # import takes any of them (`capture::import`).
    "dep:sha2",
]
# The seam itself is unconditional; an adapter is a feature.
hyperliquid = []
# **A block cursor over `eth_getLogs`.** Off by default: a chain is a different
# shape of venue from an exchange, and a consumer who wants quotes should not
# link a hash trail and a reorganisation join to get them.
rh-chain = []
# **The signing venue.** Ed25519 and base64 are here rather than unconditional
# so a tape reader links neither: a signature is a pure function, but it is a
# pure function nothing reading parquet has any use for.
rh-crypto = ["dep:ed25519-dalek", "dep:base64"]
# **The ledger: account state.** Its pure half — accounts, fingerprints, the
# bindings read back from the record — needs only the two hash crates; its
# polling needs `capture` as well. Not linked by a tape reader, which has no use
# for an HMAC.
ledger = ["dep:hmac", "dep:sha2"]
# **Test helpers for somebody else's adapter.** A venue written out of tree
# needs a sink to exercise the one path against, and #[cfg(test)] is invisible
# outside this crate — so it had none. Not a default: a production build should
# not carry a recording sink.
testing = []
# The binary, and the log formatter only it needs. A library consumer taking
# `default-features = false` gets the capture machinery without a subscriber
# they will replace anyway.
bin = ["capture", "dep:tracing-subscriber", "dep:galata-broker"]
base64 = ["dep:base64"]
ed25519-dalek = ["dep:ed25519-dalek"]

[[bin]]
name = "galata-datawatch"
required-features = ["bin"]

[[bin]]
name = "galata-tape-rebuild"
required-features = ["bin"]

[[bin]]
name = "galata-watch"
required-features = ["bin"]

[[bin]]
name = "galata-retain"
required-features = ["bin"]

[[bin]]
name = "galata-compact"
required-features = ["bin"]

[[bin]]
name = "galata-ledger"
required-features = ["bin", "ledger"]

# The out-of-tree venue test needs the helpers it is checking the visibility of.
[dev-dependencies]
# The crate depends on itself with `testing` on, so `tests/` sees the helpers a
# stranger would enable. Without this the out-of-tree venue test cannot compile,
# which is exactly the gap it was written to find.
#
# **`default-features = false` is load-bearing.** A self dev-dependency carrying
# defaults re-enables the transport in a `--no-default-features` build, which
# defeats the third wall entirely — `check-no-transport.sh` caught exactly that
# the first time this line was written without it.
galata-datawatch = { path = ".", default-features = false, features = ["testing"] }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
tempfile = "3"

# The examples that need a runtime say so, rather than failing a build that
# turned the transport off.
[[example]]
name = "probe"
required-features = ["capture"]

[[example]]
name = "tape-demo"
required-features = []
