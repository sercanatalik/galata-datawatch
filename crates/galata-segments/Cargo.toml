[package]
name = "galata-segments"
description = "Durable parquet segments: buffer, write, fsync, atomically rename — with the durability fact carried in the filename."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["parquet", "arrow", "durability", "storage", "columnar"]
categories = ["database-implementations", "filesystem"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

# **How docs.rs builds this.**
#
# `all-features` rather than a list: a list would sit beside `[features]` and
# silently omit one added later, which is the exact failure this prevents one
# level up. Safe because the feature set is ADDITIVE — no feature turns
# another off — which `check-workspace-deps.sh` is what keeps true.
#
# `--cfg docsrs` turns on `doc_auto_cfg` in the crate root, so every gated item
# carries a badge naming the feature it needs. Hand-written `#[doc(cfg(...))]`
# would be a second statement of what `#[cfg(...)]` already says, one line away
# from disagreeing with it.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# Deliberately depends on NO other workspace member. This is a general-purpose
# store — it knows nothing about markets — which is why it may publish before
# the crates that use it.
[dependencies]
arrow.workspace = true
parquet.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
