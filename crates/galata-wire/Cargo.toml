[package]
name = "galata-wire"
description = "The shared vocabulary of galata-datawatch: how an instrument is named, what a dataset is, and what a normalised market-data event carries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["market-data", "trading", "finance", "capture"]
categories = ["data-structures", "finance"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

# **How docs.rs builds this.**
#
# `all-features` rather than a list: a list would sit beside `[features]` and
# silently omit one added later, which is the exact failure this prevents one
# level up. Safe because the feature set is ADDITIVE — no feature turns
# another off — which `check-workspace-deps.sh` is what keeps true.
#
# `--cfg docsrs` turns on `doc_auto_cfg` in the crate root, so every gated item
# carries a badge naming the feature it needs. Hand-written `#[doc(cfg(...))]`
# would be a second statement of what `#[cfg(...)]` already says, one line away
# from disagreeing with it.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# THE DEPENDENCY WALL. Every future consumer of the vocabulary links this
# crate — an algo process that only needs to name an event must not inherit a
# columnar format to do it. `scripts/check-workspace-deps.sh` fails the build
# if this list grows beyond serde, serde_json, rust_decimal and thiserror.
#
# In the predecessor tree eighteen crates reached the broker through the crate
# that also owned the archive writer, so `galata-algo-fast` — whose entire
# justification is that it links no history — linked `parquet` transitively.
[dependencies]
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
