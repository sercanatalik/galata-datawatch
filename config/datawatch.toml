# galata-datawatch — what to capture, and where it lands.
#
# One file, one type, one load. Anything absent, unparseable, unknown or out of
# bounds refuses at load and the process exits non-zero — a configuration
# validated in pieces at the point of use fails halfway through a run, having
# already done something.

[paths]
# The record. One row per payload, verbatim, before any parse was attempted.
archive = "var/archive"
# The local surface, which works when the sink does not.
status = "var/status"

[capture]
# Seconds between commits. A CRASH CONVERTS THIS WINDOW INTO A GAP, which is
# why it is declared rather than defaulted.
flush_secs = 2
# How often the full status snapshot is written.
status_secs = 1
# How far back a cold start of the walk goes. The venue's own reach clips this
# where it is shorter — at a 1m bar this venue holds 3.5 days, and the walk
# REPORTS the difference rather than covering less in silence.
cold_start_days = 7
# The share of the venue's STATED budget the walk may take. A share, not a
# rate: the rate belongs to the venue's declaration.
walk_share = 0.25
# The most requests one series' walk will make. Exceeding it exits non-zero,
# because this bound is ours to raise.
walk_cap = 200

[venue.hyperliquid]
market = "mainnet"
candle = "1m"
# `quotes` is the venue's `bbo` channel rather than `l2Book`: it carries sizes
# (it is `l2Book` at one level a side) and it is emitted ONLY when the top of
# book changes on a block, so its rate is bounded by block cadence and by
# change — where the public `l2Book` is a throttled snapshot on a timer
# whatever happened.
series = ["trades", "quotes", "candles", "funding"]
instruments = [
  # The main perp dex. Continuous — this venue never closes.
  { ticker = "BTC" },
  { ticker = "ETH" },
  { ticker = "HYPE" },
  # The `xyz` HIP-3 dex. The venue spells these `xyz:XYZ100` and so on; the
  # prefix is composed at the seam, because a ticker may not hold a `:` and a
  # `:` in a partition level is a path that means something else.
  #
  # MEASURED 2026-09-20: THESE HAVE NO CALENDAR. The roadmap assumed Sun
  # 18:00 ET to Fri 17:00 ET; the record shows all three trading every hour
  # of the weekend, gold merely thinning to 29 traded minutes in 60 on a
  # Saturday morning. `cargo run --example when-open` is the measurement.
  #
  # So they are continuous, like the three above, and nothing is clipped.
  # Declaring the calendar that was assumed would have clipped a real
  # Saturday outage to a zero-length gap and marked it TIGHT.
  #
  # WTI crude is `CL` here, not `WTIOIL`. Two published sources disagreed —
  # one lists "WTI crude (CL)", the other "WTIOIL" — and the venue's own
  # universe settles it: `meta` with `dex = "xyz"` lists `xyz:CL` and
  # `xyz:BRENTOIL`, and no WTIOIL at all.
  #
  # That mattered more than a name. AN UNLISTED COIN MAKES THE VENUE HANG UP
  # rather than refuse the subscription, and every other subscription on that
  # socket dies with it. One wrong ticker here took down capture for all six
  # instruments, seventeen times in eighteen seconds.
  { ticker = "CL",     dex = "xyz" },
  { ticker = "XYZ100", dex = "xyz" },
  { ticker = "GOLD",   dex = "xyz" },
]
