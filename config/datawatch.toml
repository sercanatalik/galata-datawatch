# galata-datawatch — what to capture, and where it lands.
#
# One file, one type, one load. Anything absent, unparseable, unknown or out of
# bounds refuses at load and the process exits non-zero — a configuration
# validated in pieces at the point of use fails halfway through a run, having
# already done something.

[paths]
# The record. One row per payload, verbatim, before any parse was attempted.
archive = "var/archive"
# The local surface, which works when the sink does not.
status = "var/status"
# The tape: the projection that makes the record queryable. A CACHE — deleting
# it loses nothing the archive does not hold, and `galata-tape-rebuild` writes
# it again.
tape = "var/tape"

[capture]
# Seconds between commits. A CRASH CONVERTS THIS WINDOW INTO A GAP, which is
# why it is declared rather than defaulted.
flush_secs = 2
# How often the full status snapshot is written.
status_secs = 1
# How far back a cold start of the walk goes. The venue's own reach clips this
# where it is shorter — at a 1m bar this venue holds 3.5 days, and the walk
# REPORTS the difference rather than covering less in silence.
cold_start_days = 7
# The share of the venue's STATED budget the walk may take. A share, not a
# rate: the rate belongs to the venue's declaration.
walk_share = 0.25
# The most requests one series' walk will make. Exceeding it exits non-zero,
# because this bound is ours to raise. It also bounds each history fill's pages
# (a declared width or the funding depth, per instrument); a history fill that
# reaches it stops with an error and capture continues.
walk_cap = 200
# Seconds between settles of the candle bars closed while running. The stream
# never sends a bar final and the walk runs at boot, so WITHOUT THIS A RUNNING
# CAPTURE HOLDS FORMING ROWS AND NO CLOSES. Optional, no default, 60..=86400.
# Commented because every binary that reads this document refuses a key it
# does not know: rebuild the ledger and the tower before writing it.
# settle_secs = 300

[venue.hyperliquid]
market = "mainnet"
candle = "1m"
# Bar widths the walk FETCHES beside `candle`, never subscribed live. The venue
# serves the most recent ~5,000 bars of each on a rolling window (measured
# 2026-09-25: 1h back to 2026-03-01, 4h to 2024-06-14, 1d from listing), so a
# width not declared here is history leaving the venue uncaptured. Each is
# asked for its whole reach on every boot, as fills AFTER the live subscription
# (pace-by-the-venue-weight): 18 pages across six instruments, ~104 weight each,
# ~6 min at walk_share 0.25.
walk_candles = ["1h", "4h", "1d"]
# How many days of SETTLED funding the walk asks for, on every boot. Without it
# the funding walk resumes from the record's receipt clock and reaches back only
# to when capture began, while the venue holds every settlement since it began
# (BTC and ETH from 2023-05-12, 1,233 days on 2026-09-26). At 1,300 days: at most
# ~60 pages for BTC and ETH, ~194 for six instruments, 44.8 KB and 45 weight a
# page: ~30 min of paced fills at walk_share 0.25, after the live subscription,
# so the restart hole does not grow with it. REBUILD every binary that reads
# this file before enabling it: each refuses a key it does not know.
# walk_funding_days = 1300
# `quotes` is the venue's `bbo` channel rather than `l2Book`: it carries sizes
# (it is `l2Book` at one level a side) and it is emitted when the top of book
# changes, where the public `l2Book` is a throttled snapshot on a timer
# whatever happened.
#
# MEASURED 2026-09-21, BOTH CHANNELS ON ONE SOCKET FOR 75 s: bbo is 4.0x the
# BYTES and 43x the messages of l2Book. Event-driven is the COST here, not the
# saving — the top of book changes far more often than every 5.27 s.
#
# What it buys is the dataset itself: bbo showed 43x as many distinct tops. A
# snapshot every 5.27 s shows one top in 43 and cannot say what happened
# between them, and "the top of book as it moved" is what `quotes` IS.
#
# The bill: 6.72 KiB/s over six instruments, 567 MiB/day raw, 32.9 MiB/day at
# the archive's measured zstd ratio — 5.5 MiB/day/ticker, against the
# predecessor's 44 MB/day/ticker for candles.
#
# No `trades`, since 2026-11-24. The venue's public prints were a fifth of
# everything captured (1.09M rows and 23 MiB of tape a day over nine
# instruments, measured 2026-11-18), and nothing that runs reads them: the
# desk and the signals read candles, which already carry volume and trade
# count. They were for tick-level research, which is set aside. An account's
# own fills are the ledger's, and are not this.
#
# What is not captured is not in the record. The venue publishes its fills
# after the fact, so the trades can be fetched later. The top of book as it
# moved can be fetched from nowhere, which is why `quotes` stays.
series = ["quotes", "candles", "funding"]
instruments = [
  # The main perp dex. Continuous — this venue never closes.
  { ticker = "BTC" },
  { ticker = "ETH" },
  { ticker = "HYPE" },
  # The `xyz` HIP-3 dex. The venue spells these `xyz:XYZ100` and so on; the
  # prefix is composed at the seam, because a ticker may not hold a `:` and a
  # `:` in a partition level is a path that means something else.
  #
  # MEASURED 2026-09-20: THESE HAVE NO CALENDAR. The roadmap assumed Sun
  # 18:00 ET to Fri 17:00 ET; the record shows all three trading every hour
  # of the weekend, gold merely thinning to 29 traded minutes in 60 on a
  # Saturday morning. `cargo run --example when-open` is the measurement.
  #
  # So they are continuous, like the three above, and nothing is clipped.
  # Declaring the calendar that was assumed would have clipped a real
  # Saturday outage to a zero-length gap and marked it TIGHT.
  #
  # WTI crude is `CL` here, not `WTIOIL`. Two published sources disagreed —
  # one lists "WTI crude (CL)", the other "WTIOIL" — and the venue's own
  # universe settles it: `meta` with `dex = "xyz"` lists `xyz:CL` and
  # `xyz:BRENTOIL`, and no WTIOIL at all.
  #
  # That mattered more than a name. AN UNLISTED COIN MAKES THE VENUE HANG UP
  # rather than refuse the subscription, and every other subscription on that
  # socket dies with it. One wrong ticker here took down capture for all six
  # instruments, seventeen times in eighteen seconds.
  { ticker = "CL",     dex = "xyz" },
  { ticker = "XYZ100", dex = "xyz" },
  { ticker = "GOLD",   dex = "xyz" },
  # Added 2026-11-16, each checked against the venue's own universe first
  # (`meta` with `dex = "xyz"`, 145 instruments): `xyz:NVDA`, `xyz:SILVER`
  # and `xyz:ANT` are listed and not delisted. No calendar is declared for
  # them, as for the three above; NVDA is an equity, and whether it thins or
  # stops outside its home session is not yet measured here.
  { ticker = "NVDA",   dex = "xyz" },
  { ticker = "SILVER", dex = "xyz" },
  { ticker = "ANT",    dex = "xyz" },
  # Added 2026-11-28, the markets on galata-desk's watchlist that capture did
  # not follow, so the watcher's market update and move alerts had nothing to
  # read for them. Each checked against the venue's own universe first
  # (`metaAndAssetCtxs` with `dex = "xyz"`, 150 instruments): listed and not
  # delisted, with a day's volume of $154M (SKHX), $64.7M (BRENTOIL), $19.1M
  # (AMD) and $0.77M (BABA). No calendar is declared for them, as for the
  # others; AMD, BABA and SKHX are equities, and whether they thin or stop
  # outside their home sessions is not yet measured here.
  { ticker = "SKHX",     dex = "xyz" },
  { ticker = "BRENTOIL", dex = "xyz" },
  { ticker = "AMD",      dex = "xyz" },
  { ticker = "BABA",     dex = "xyz" },
]

# A CHAIN VENUE IS NOT DECLARED HERE EITHER, AND ITS PROVIDER IS A SECRET.
#
# The public node needs no key, so with no block at all `rh-chain` would reach
# it. To capture the chain:
#
#   [venue.rh-chain]
#   market = "mainnet"
#   candle = "1m"
#   series = ["transfers"]
#   # THE NAME OF A VARIABLE, never a URL. Absent means the public node.
#   #
#   # A keyed provider puts its key in the URL PATH --
#   # https://arb-mainnet.g.alchemy.com/v2/<KEY> -- so the URL is the
#   # credential, and there is deliberately NO `rpc_url` field to put it in:
#   # that field would be one `_var` suffix away from committing a key here.
#   #
#   # Named and unset REFUSES rather than falling back to the public node. A
#   # silent fallback is how a process runs for a week against a provider
#   # nobody chose.
#   rpc_url_var = "GALATA_RHCHAIN_RPC_URL"
#   instruments = [
#     # BOTH REQUIRED. A chain instrument with no contract is unaddressable,
#     # and stock tokens carry 18 decimals while USDG carries 6 -- so a
#     # default would be wrong by a factor of a trillion for one of them.
#     { ticker = "NVDA", contract = "0xd0601ce157db5bdc3162bbac2a2c8af5320d9eec", decimals = 18 },
#   ]
#
# MEASURED 2026-09-21: NVDA's ERC-8056 uiMultiplier is 1.0007751591646306, so a
# raw token amount understates shares by 0.0775%. The multiplier is recorded
# hourly as its own dated fact and NEVER applied at capture -- rows written
# before and after a corporate action would otherwise carry amounts computed
# under different multipliers with nothing saying which.

# DERIVE IS NOT DECLARED HERE, AND ITS INSTRUMENTS EXPIRE.
#
# Options on Derive (derive.xyz), from public data, behind the `derive-xyz`
# feature. To capture them:
#
#   [venue.derive-xyz]
#   market = "mainnet"
#   # `quotes` is the venue's ticker, once a second per option. One payload
#   # is three datasets: the option's top of book (`quotes`), its mark, index
#   # and open interest (`marks`), and the venue's own implied volatility and
#   # greeks (`option_pricing`). A gap in `quotes` is a gap in all three.
#   #
#   # NOT `trades`: the venue has the channel and this capture does not take
#   # it, so naming it here is refused at load. No `candle` either -- the
#   # venue pushes no bars.
#   series = ["quotes"]
#   # THE VENUE'S OWN NAMES, each one option: <CCY>-<YYYYMMDD>-<STRIKE>-<C|P>,
#   # a fractional strike spelled with `_` (ADA-20261127-0_15-C). AT MOST 50,
#   # counted apart from every other venue's instruments. A name twice, a name
#   # of another shape, or a fifty-first is refused at load.
#   #
#   # The index of each underlying named here is captured beside its options
#   # (as BTC-USD, ETH-USD) without being declared, and is not counted. So is
#   # its perpetual (BTC-PERP, ETH-PERP): quote, mark and funding rate, once
#   # a second. A perpetual is NOT a name to declare here -- it follows from
#   # the options, and declaring one is refused as any name that is not an
#   # option is. If the venue lists none for an underlying, the options are
#   # captured without it and the status file says so.
#   instruments = [
#     { ticker = "BTC-20261225-60000-P" },
#     { ticker = "ETH-20261225-2000-C" },
#   ]
#
# AN OPTION EXPIRES, AND THEN IT LEAVES THE SET. At boot each name is asked of
# the venue: one it has never listed refuses the start, because the venue
# acknowledges a subscription to an unknown name and then sends nothing
# (measured 2026-11-24); one that has expired is dropped for this run and the
# rest are captured. While running, an option leaves at the hour the venue
# states -- 08:00 UTC for crypto, 21:00 for equities, 19:30 for crude -- and
# the status file lists it under `left` with its reason and time. If EVERY
# declared option has expired the process exits non-zero, naming each.
#
# NOTHING ROLLS A SLOT. Replacing an expired option is an edit here and a
# restart, and until then the slot is empty.
#
# MEASURED 2026-11-24, 50 OPTIONS AND 4 INDEXES FOR 630 s: the venue sends
# every ticker every second whether or not anything changed -- 27.5 KB/s,
# 2.26 GiB a day before compression, four times what Hyperliquid's `bbo` was
# for six instruments (567 MiB). See design/measured.md.

# ROBINHOOD CRYPTO IS NOT DECLARED HERE, BECAUSE EVERY REQUEST IS SIGNED.
#
# Market data included: there is no anonymous read. To poll it:
#
#   [venue.rh-crypto]
#   market = "mainnet"
#   candle = "1m"
#   series = ["quotes"]
#   # REQUIRED, and no default is invented: the venue's limits are
#   # undocumented and variable, and the interval is also the width of the gap
#   # one failed poll produces.
#   poll_secs = 5
#   # NAMES OF VARIABLES, never the keys -- resolved through the secret source
#   # (the environment, or the vault binary's vault). The private key is the
#   # base64 32-byte Ed25519 SEED, not a 64-byte keypair and not PKCS#8; each
#   # of those is refused by name.
#   api_key_var = "GALATA_RHCRYPTO_API_KEY"
#   private_key_var = "GALATA_RHCRYPTO_PRIVATE_KEY"
#   # The ticker as this tree names it; the venue's `BTC-USD` is composed.
#   instruments = [{ ticker = "BTC" }, { ticker = "ETH" }]
#
# NOT YET CALLED LIVE. The request, its signature over the path WITH its query,
# and the 429 mapping are proved against a local server; the published docs
# disagree on /api/v1/ versus /api/v2/, and the first live poll settles it.

# NOR IS [watch], AND THAT MEANS ONLY STRUCTURAL PROBLEMS ARE CHECKED.
#
# The status surface REPORTS AND NEVER JUDGES -- a threshold inside capture
# cannot be changed without a deploy and is wrong for the next instrument
# anyway. `galata-watch` is the component that judges, and its bounds are the
# operator's:
#
#   [watch]
#   # A CLOSED partition holding more segments than this means compaction is
#   # overdue. Today's partition is exempt: it is supposed to hold many small
#   # segments, which is what flush_secs = 2 buys.
#   max_segments_in_closed_partition = 64
#   # How old the newest segment may be before the record is stale.
#   max_record_age_secs = 300
#   # How far, in Fisher z, the var-covar signal's fitted R-bar may sit from
#   # derive's equal-weight rho over the same window. Measured 2026-09-28: at
#   # most 0.076 (4h), 0.041 (1h), 0.038 (5m) on a healthy record.
#   max_correlation_target_gap = 0.15
#   # Below this Engle-Sheppard p-value, in two consecutive windows, a fitted
#   # horizon's constant correlation is flagged. The test runs every half hour
#   # on overlapping 30-day windows, so 0.001, not 0.05: about one false
#   # episode in years rather than one a month per horizon.
#   max_constancy_p = 0.001
#   # Report the sequential correlation monitor's alarms (Wied-Galeano, per
#   # calendar epoch). Its false alarms are bounded where it is computed
#   # (alpha 0.05 per epoch per horizon), so this is a switch, not a number.
#   monitor_alarms = true
#
# With no block it still reports a ticker that became a directory, because that
# is not a matter of degree. It watches THE RECORD, not the scheduler: a
# heartbeat is a claim, and a closed partition holding 3,572 segments is a fact
# on disk.

# THE BROKER IS NOT DECLARED HERE EITHER, AND CAPTURE RUNS ANYWAY.
#
# The record does not depend on the broker: with no `[broker]` block, events
# are archived and published nowhere, which is a supported state rather than a
# degraded one. A nine-hour soak ran exactly this way.
#
# To publish:
#
#   [broker]
#   url = "nats://127.0.0.1:4222"
#   # A URL CARRYING `user:password@` IS REFUSED AT LOAD. The password has a
#   # variable of its own, so userinfo here would be a credential in a
#   # committed file -- and the connect line logs this URL.
#   # Nothing connects anonymously. The identity is `datawatch-<venue>`, the
#   # name config/nats-authorization.conf grants: `datawatch` alone is refused.
#   user = "datawatch-hyperliquid"
#   # A REFERENCE, never a secret. The file binary reads this as an environment
#   # variable; the vault binary reads it as a vault secret name.
#   password_var = "GALATA_DATAWATCH_PASSWORD"
#   # Exactly the number of events a broker stall may swallow before they
#   # start being dropped. Dropped events are counted and appear on the
#   # status surface as `sink_dropped`; capture never blocks for the broker.
#   queue = 8192
#
# A broker that DOES NOT ANSWER is an outage: the process warns and carries on.
# A broker that REFUSES THE IDENTITY is a misconfiguration that will never fix
# itself, and the process exits non-zero rather than archiving everything,
# publishing nothing, and being unable to report it.

# RETENTION IS NOT DECLARED HERE, AND THAT IS THE DEFAULT.
#
# Numbers are the measurer's and horizons are the operator's. A default in this
# file would be the builder answering "how long should this be kept?" for
# somebody who knows what the data is. With no `[retention]` block,
# `galata-retain` expires nothing and exits 3.
#
# To declare one:
#
#   [retention]
#   # The TAPE is a cache: anything dropped comes back from a rebuild, so this
#   # may be short without much thought.
#   tape_days = 7
#
#   [retention.venue]
#   # The ARCHIVE is a record. Losing it is unrecoverable, and a venue absent
#   # from this block is kept forever rather than assigned a number nobody
#   # chose.
#   hyperliquid = 90

# THE LEDGER IS NOT DECLARED HERE: IT READS THE OPERATOR'S OWN ACCOUNTS.
#
# `galata-ledger <venue>` records the accounts a deployment declares, by
# address and with no key (README, "The account ledger"): each account's
# margin and positions per dex, its spot balances, its borrow and lend state,
# and its history. Addresses and the fingerprint key are secrets: this file
# names the variables that hold them, never the values. Both roots must be
# owner-only (0700), and a root others can read is refused.
#
#   [ledger]
#   # The record: every answer, verbatim.
#   root = "var/ledger"
#   # Its projection, typed Parquet per account and kind. Optional.
#   tape = "var/ledger-tape"
#   # Seconds between reads of each account's state. 1..=3600.
#   snapshot_secs = 300
#   # Seconds between discovery runs: sub-accounts, role, mode, and the
#   # venue's names for the tokens balances refer to. 1..=86400.
#   discover_secs = 600
#   # Seconds between asks for each account's fills, funding and ledger
#   # updates. Optional: without it no history is walked.
#   events_secs = 300
#   # How far the fold's book may stray from a snapshot before it says so.
#   fold_position_tolerance = 0.0
#   fold_relative_tolerance = 0.00002
#   # The ledger's share of the venue's request budget; with walk_share, at
#   # most the whole. Cadences the share cannot afford are refused at load.
#   ledger_share = 0.25
#   # The variable holding the key addresses are fingerprinted under. Once a
#   # ledger has written under it, it can never be another.
#   fingerprint_key_var = "GALATA_LEDGER_FINGERPRINT_KEY"
#
#   [ledger.account.main]
#   venue = "hyperliquid"
#   # The variable holding the account's address: never the address.
#   address_var = "GALATA_LEDGER_HL_MAIN"
#   # The dexes to read margin, positions and open orders on; "" is the
#   # main one.
#   dexes = ["", "xyz"]
#
#   # A Derive wallet, behind the `derive-xyz` feature (README, "Derive: a
#   # wallet, read with a session key"): every subaccount in one request a
#   # snapshot, each read signed by a session key that may trade and may not
#   # move funds.
#   [ledger.account.owner]
#   venue = "derive-xyz"
#   # The Derive wallet the key is registered to, NOT the address its owner
#   # signs in with: never the address.
#   address_var = "GALATA_LEDGER_DERIVE_WALLET"
#   session_key_var = "GALATA_LEDGER_DERIVE_SESSION_KEY"
#   # Days before the key expires from which the status warns. 14 if absent.
#   session_key_warn_days = 14
#   # The network, since [venue.derive-xyz] is declared only where Derive is
#   # captured. Where it is declared, its network is the ledger's and this
#   # may repeat it, not contradict it.
#   market = "mainnet"

# --- Margin advice (galata-margin) ---------------------------------------
#
# Where to place a Derive option's perpetual hedge, and what each placement
# costs (README, "Margin advice"). Every key is required; none has a default,
# since each decides a proposal. The tools that read this document must be
# built from a tree that knows the block before it is written.
#
#   [margin]
#   # The variable holding the Derive session key: the ledger's, since one key
#   # serves both. Checked at start by the ledger's rule.
#   session_key_var = "GALATA_LEDGER_DERIVE_SESSION_KEY"
#   # How far galata's portfolio margin ratio may differ from Hyperliquid's
#   # before its figures are labelled estimates. A decimal string.
#   agreement_tolerance = "0.001"
#   # The oldest account snapshot a figure may rest on, no shorter than the
#   # ledger's snapshot_secs.
#   snapshot_age_secs = 900
#   # The hedge's splits, in percent on Derive, beside all on either venue.
#   split_pct = [25, 50, 75]
#   # The holding period funding is counted over, in hours.
#   funding_hours = 168
#   # The largest share of the hedge one venue may hold, in percent.
#   venue_cap_pct = 100
#
#   [margin.accounts]
#   # The accounts a placement may land in, by the ledger's aliases.
#   derive-xyz = ["owner_s3"]
#   hyperliquid = ["main"]
