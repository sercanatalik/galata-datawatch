# galata-datawatch — what to capture, and where it lands.
#
# One file, one type, one load. Anything absent, unparseable, unknown or out of
# bounds refuses at load and the process exits non-zero — a configuration
# validated in pieces at the point of use fails halfway through a run, having
# already done something.

[paths]
# The record. One row per payload, verbatim, before any parse was attempted.
archive = "var/archive"
# The local surface, which works when the sink does not.
status = "var/status"
# The tape: the projection that makes the record queryable. A CACHE — deleting
# it loses nothing the archive does not hold, and `galata-tape-rebuild` writes
# it again.
tape = "var/tape"

[capture]
# Seconds between commits. A CRASH CONVERTS THIS WINDOW INTO A GAP, which is
# why it is declared rather than defaulted.
flush_secs = 2
# How often the full status snapshot is written.
status_secs = 1
# How far back a cold start of the walk goes. The venue's own reach clips this
# where it is shorter — at a 1m bar this venue holds 3.5 days, and the walk
# REPORTS the difference rather than covering less in silence.
cold_start_days = 7
# The share of the venue's STATED budget the walk may take. A share, not a
# rate: the rate belongs to the venue's declaration.
walk_share = 0.25
# The most requests one series' walk will make. Exceeding it exits non-zero,
# because this bound is ours to raise.
walk_cap = 200
# Seconds between settles of the candle bars closed while running. The stream
# never sends a bar final and the walk runs at boot, so WITHOUT THIS A RUNNING
# CAPTURE HOLDS FORMING ROWS AND NO CLOSES. Optional, no default, 60..=86400.
# Commented because every binary that reads this document refuses a key it
# does not know: rebuild the ledger and the tower before writing it.
# settle_secs = 300

[venue.hyperliquid]
market = "mainnet"
candle = "1m"
# Bar widths the walk FETCHES beside `candle`, never subscribed live. The venue
# serves the most recent ~5,000 bars of each on a rolling window (measured
# 2026-09-25: 1h back to 2026-03-01, 4h to 2024-06-14, 1d from listing), so a
# width not declared here is history leaving the venue uncaptured. Each is
# asked for its whole reach on every boot: 18 requests across six instruments.
walk_candles = ["1h", "4h", "1d"]
# `quotes` is the venue's `bbo` channel rather than `l2Book`: it carries sizes
# (it is `l2Book` at one level a side) and it is emitted when the top of book
# changes, where the public `l2Book` is a throttled snapshot on a timer
# whatever happened.
#
# MEASURED 2026-09-21, BOTH CHANNELS ON ONE SOCKET FOR 75 s: bbo is 4.0x the
# BYTES and 43x the messages of l2Book. Event-driven is the COST here, not the
# saving — the top of book changes far more often than every 5.27 s.
#
# What it buys is the dataset itself: bbo showed 43x as many distinct tops. A
# snapshot every 5.27 s shows one top in 43 and cannot say what happened
# between them, and "the top of book as it moved" is what `quotes` IS.
#
# The bill: 6.72 KiB/s over six instruments, 567 MiB/day raw, 32.9 MiB/day at
# the archive's measured zstd ratio — 5.5 MiB/day/ticker, against the
# predecessor's 44 MB/day/ticker for candles.
series = ["trades", "quotes", "candles", "funding"]
instruments = [
  # The main perp dex. Continuous — this venue never closes.
  { ticker = "BTC" },
  { ticker = "ETH" },
  { ticker = "HYPE" },
  # The `xyz` HIP-3 dex. The venue spells these `xyz:XYZ100` and so on; the
  # prefix is composed at the seam, because a ticker may not hold a `:` and a
  # `:` in a partition level is a path that means something else.
  #
  # MEASURED 2026-09-20: THESE HAVE NO CALENDAR. The roadmap assumed Sun
  # 18:00 ET to Fri 17:00 ET; the record shows all three trading every hour
  # of the weekend, gold merely thinning to 29 traded minutes in 60 on a
  # Saturday morning. `cargo run --example when-open` is the measurement.
  #
  # So they are continuous, like the three above, and nothing is clipped.
  # Declaring the calendar that was assumed would have clipped a real
  # Saturday outage to a zero-length gap and marked it TIGHT.
  #
  # WTI crude is `CL` here, not `WTIOIL`. Two published sources disagreed —
  # one lists "WTI crude (CL)", the other "WTIOIL" — and the venue's own
  # universe settles it: `meta` with `dex = "xyz"` lists `xyz:CL` and
  # `xyz:BRENTOIL`, and no WTIOIL at all.
  #
  # That mattered more than a name. AN UNLISTED COIN MAKES THE VENUE HANG UP
  # rather than refuse the subscription, and every other subscription on that
  # socket dies with it. One wrong ticker here took down capture for all six
  # instruments, seventeen times in eighteen seconds.
  { ticker = "CL",     dex = "xyz" },
  { ticker = "XYZ100", dex = "xyz" },
  { ticker = "GOLD",   dex = "xyz" },
]

# A CHAIN VENUE IS NOT DECLARED HERE EITHER, AND ITS PROVIDER IS A SECRET.
#
# The public node needs no key, so with no block at all `rh-chain` would reach
# it. To capture the chain:
#
#   [venue.rh-chain]
#   market = "mainnet"
#   candle = "1m"
#   series = ["transfers"]
#   # THE NAME OF A VARIABLE, never a URL. Absent means the public node.
#   #
#   # A keyed provider puts its key in the URL PATH --
#   # https://arb-mainnet.g.alchemy.com/v2/<KEY> -- so the URL is the
#   # credential, and there is deliberately NO `rpc_url` field to put it in:
#   # that field would be one `_var` suffix away from committing a key here.
#   #
#   # Named and unset REFUSES rather than falling back to the public node. A
#   # silent fallback is how a process runs for a week against a provider
#   # nobody chose.
#   rpc_url_var = "GALATA_RHCHAIN_RPC_URL"
#   instruments = [
#     # BOTH REQUIRED. A chain instrument with no contract is unaddressable,
#     # and stock tokens carry 18 decimals while USDG carries 6 -- so a
#     # default would be wrong by a factor of a trillion for one of them.
#     { ticker = "NVDA", contract = "0xd0601ce157db5bdc3162bbac2a2c8af5320d9eec", decimals = 18 },
#   ]
#
# MEASURED 2026-09-21: NVDA's ERC-8056 uiMultiplier is 1.0007751591646306, so a
# raw token amount understates shares by 0.0775%. The multiplier is recorded
# hourly as its own dated fact and NEVER applied at capture -- rows written
# before and after a corporate action would otherwise carry amounts computed
# under different multipliers with nothing saying which.

# ROBINHOOD CRYPTO IS NOT DECLARED HERE, BECAUSE EVERY REQUEST IS SIGNED.
#
# Market data included: there is no anonymous read. To poll it:
#
#   [venue.rh-crypto]
#   market = "mainnet"
#   candle = "1m"
#   series = ["quotes"]
#   # REQUIRED, and no default is invented: the venue's limits are
#   # undocumented and variable, and the interval is also the width of the gap
#   # one failed poll produces.
#   poll_secs = 5
#   # NAMES OF VARIABLES, never the keys -- resolved through the secret source
#   # (the environment, or the vault binary's vault). The private key is the
#   # base64 32-byte Ed25519 SEED, not a 64-byte keypair and not PKCS#8; each
#   # of those is refused by name.
#   api_key_var = "GALATA_RHCRYPTO_API_KEY"
#   private_key_var = "GALATA_RHCRYPTO_PRIVATE_KEY"
#   # The ticker as this tree names it; the venue's `BTC-USD` is composed.
#   instruments = [{ ticker = "BTC" }, { ticker = "ETH" }]
#
# NOT YET CALLED LIVE. The request, its signature over the path WITH its query,
# and the 429 mapping are proved against a local server; the published docs
# disagree on /api/v1/ versus /api/v2/, and the first live poll settles it.

# NOR IS [watch], AND THAT MEANS ONLY STRUCTURAL PROBLEMS ARE CHECKED.
#
# The status surface REPORTS AND NEVER JUDGES -- a threshold inside capture
# cannot be changed without a deploy and is wrong for the next instrument
# anyway. `galata-watch` is the component that judges, and its bounds are the
# operator's:
#
#   [watch]
#   # A CLOSED partition holding more segments than this means compaction is
#   # overdue. Today's partition is exempt: it is supposed to hold many small
#   # segments, which is what flush_secs = 2 buys.
#   max_segments_in_closed_partition = 64
#   # How old the newest segment may be before the record is stale.
#   max_record_age_secs = 300
#
# With no block it still reports a ticker that became a directory, because that
# is not a matter of degree. It watches THE RECORD, not the scheduler: a
# heartbeat is a claim, and a closed partition holding 3,572 segments is a fact
# on disk.

# THE BROKER IS NOT DECLARED HERE EITHER, AND CAPTURE RUNS ANYWAY.
#
# The record does not depend on the broker: with no `[broker]` block, events
# are archived and published nowhere, which is a supported state rather than a
# degraded one. A nine-hour soak ran exactly this way.
#
# To publish:
#
#   [broker]
#   url = "nats://127.0.0.1:4222"
#   # A URL CARRYING `user:password@` IS REFUSED AT LOAD. The password has a
#   # variable of its own, so userinfo here would be a credential in a
#   # committed file -- and the connect line logs this URL.
#   # Nothing connects anonymously. The identity is `datawatch-<venue>`, the
#   # name config/nats-authorization.conf grants: `datawatch` alone is refused.
#   user = "datawatch-hyperliquid"
#   # A REFERENCE, never a secret. The file binary reads this as an environment
#   # variable; the vault binary reads it as a vault secret name.
#   password_var = "GALATA_DATAWATCH_PASSWORD"
#   # Exactly the number of events a broker stall may swallow before they
#   # start being dropped. Dropped events are counted and appear on the
#   # status surface as `sink_dropped`; capture never blocks for the broker.
#   queue = 8192
#
# A broker that DOES NOT ANSWER is an outage: the process warns and carries on.
# A broker that REFUSES THE IDENTITY is a misconfiguration that will never fix
# itself, and the process exits non-zero rather than archiving everything,
# publishing nothing, and being unable to report it.

# RETENTION IS NOT DECLARED HERE, AND THAT IS THE DEFAULT.
#
# Numbers are the measurer's and horizons are the operator's. A default in this
# file would be the builder answering "how long should this be kept?" for
# somebody who knows what the data is. With no `[retention]` block,
# `galata-retain` expires nothing and exits 3.
#
# To declare one:
#
#   [retention]
#   # The TAPE is a cache: anything dropped comes back from a rebuild, so this
#   # may be short without much thought.
#   tape_days = 7
#
#   [retention.venue]
#   # The ARCHIVE is a record. Losing it is unrecoverable, and a venue absent
#   # from this block is kept forever rather than assigned a number nobody
#   # chose.
#   hyperliquid = 90
