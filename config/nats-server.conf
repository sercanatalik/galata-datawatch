# The broker's server: what it keeps, and who may use it.
#
# Read by the server in the broker's container, where config/ is mounted
# read-only at /etc/galata (scripts/run-service.sh nats). Committed, and holds
# no secret: the authorization file it includes names each password as a
# variable, handed to the server over standard input.
#
# **JetStream keeps a window of the bus** (galata-broker's `streams::table`,
# applied at each start by `galata-bus`):
#
# - **The store is a volume of the broker's own**, at /data: nothing else reads
#   it, and it is a cache of what the archive and the ledger hold.
# - **No memory store.** Every stream is on file, so the window survives a
#   restart of the broker.
# - **The file-store cap must exceed the streams' byte caps together.**
#   JetStream reserves a capped stream's bytes against it when the stream is
#   created, and refuses the stream otherwise ("insufficient storage
#   resources"). MARKETS is capped at 2 GiB until the deployment's rate is
#   measured (add-bus-replay-window, task 6.4); ACCOUNTS and STATUS are
#   bounded by age and by message count.

# `store_dir` is the volume itself: the server keeps its streams in a
# `jetstream/` folder of its own beneath it.
jetstream {
  store_dir: "/data"
  max_memory_store: 0
  max_file_store: 4GB
}

# Generated from galata-broker's grant table; never edited by hand.
include "nats-authorization.conf"
